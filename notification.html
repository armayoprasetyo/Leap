<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: transparent;
    }
    .banner {
      background: #1e1e1e;
      color: white;
      width: 350px;
      height: 80px;
      border-radius: 12px;
      border-left: 5px solid #25D366; /* WhatsApp Green */
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      -webkit-app-region: drag; /* Allow moving the notification */
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .icon {
      width: 50px;
      height: 50px;
      background: #25D366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-right: 15px;
      flex-shrink: 0;
    }
    .content {
      flex: 1;
    }
    .title {
      font-weight: bold;
      font-size: 14px;
      color: #25D366;
      margin-bottom: 2px;
    }
    .message {
      font-size: 13px;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="icon" id="icon">💬</div>
    <div class="content">
      <div class="title" id="title">Project Update</div>
      <div class="message" id="message">Loading message...</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('notif-data', (event, data) => {
      document.getElementById('message').innerText = data.message;
      if (data.type === 'insert') document.getElementById('icon').innerText = '✨';
      if (data.type === 'update') document.getElementById('icon').innerText = '🔄';
    });
  </script>
</body>
</html>
